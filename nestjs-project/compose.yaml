services:
  nestjs-api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - .:/home/node/app
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy

  video-worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    # On a fresh clone node_modules only exists after `npm install` (run in
    # nestjs-api, same volume): wait for it instead of crash-looping. `exec`
    # then replaces the shell with node, so SIGTERM from
    # `docker compose stop/restart` reaches Nest's shutdown hooks and BullMQ
    # can finish the active job instead of leaving it to stall. `init` reaps
    # the ffmpeg/ffprobe children.
    command:
      - sh
      - -c
      - >-
        until [ -f node_modules/.bin/ts-node ]; do
        echo "video-worker: waiting for npm install"; sleep 2; done;
        exec node -r ts-node/register -r tsconfig-paths/register src/worker.main.ts
    init: true
    # ffprobe + ffmpeg are capped at 60 s each; give an active job time to end.
    stop_grace_period: 3m
    # Back up after a crash.
    restart: unless-stopped
    volumes:
      - .:/home/node/app
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=streamtube
      - POSTGRES_PASSWORD=streamtube
      - POSTGRES_DB=streamtube
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamtube"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  minio:
    image: pgsty/silo:RELEASE.2026-11-12T00-00-00Z
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY_ID:-minioadmin}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_ACCESS_KEY:-minioadmin}
      # Incomplete multipart uploads older than 24h are expired by the storage
      # itself (the defaults, pinned so the dependency is visible). This
      # removes sessions no draft references any more; the app cannot list
      # them (MinIO lists multipart uploads by exact key). The clock is
      # independent of VIDEO_DRAFT_TTL_HOURS (24): raise both together.
      - MINIO_API_STALE_UPLOADS_EXPIRY=24h
      - MINIO_API_STALE_UPLOADS_CLEANUP_INTERVAL=6h
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  minio_data:
  redis_data:
